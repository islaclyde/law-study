<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>법학 공부 트래커</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0c; --bg2: #181714; --bg3: #211f1b; --card: #1c1a17;
    --border: #2e2b25; --gold: #c9a84c; --gold2: #e8c97a;
    --gold-dim: rgba(201,168,76,0.12); --gold-dim2: rgba(201,168,76,0.06);
    --text: #e8e2d6; --text2: #9e9789; --text3: #5c5850;
    --red: #c0392b; --green2: #4caf50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; overflow-x: hidden; }

  /* Loading */
  .loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 1rem; transition: opacity 0.5s; }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 0.8rem; color: var(--text3); font-family: 'DM Mono', monospace; }

  /* Header */
  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top: 0; z-index: 100; }
  .logo { font-family: 'Noto Serif KR', serif; font-size: 1.15rem; font-weight: 700; color: var(--gold); display: flex; align-items: center; gap: 0.6rem; }
  .logo-icon { width: 28px; height: 28px; border: 1.5px solid var(--gold); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
  .header-right { display: flex; align-items: center; gap: 1rem; }
  .today-info { font-size: 0.75rem; color: var(--text2); font-family: 'DM Mono', monospace; }
  .sync-status { font-size: 0.7rem; font-family: 'DM Mono', monospace; padding: 0.25rem 0.6rem; border-radius: 100px; border: 1px solid var(--border); color: var(--text3); transition: all 0.3s; }
  .sync-status.synced { border-color: var(--green2); color: var(--green2); }
  .sync-status.syncing { border-color: var(--gold); color: var(--gold); }
  .sync-status.error { border-color: var(--red); color: var(--red); }

  /* Nav */
  nav { background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 1.5rem; }
  nav::-webkit-scrollbar { display: none; }
  .nav-btn { padding: 0.85rem 1.2rem; font-size: 0.8rem; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; color: var(--text2); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
  .nav-btn:hover { color: var(--gold2); }
  .nav-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* Main */
  main { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .section { display: none; }
  .section.active { display: block; }
  .section-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 1.8rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .section-title { font-family: 'Noto Serif KR', serif; font-size: 1.4rem; font-weight: 600; color: var(--gold); }
  .section-subtitle { font-size: 0.75rem; color: var(--text3); margin-top: 0.3rem; }

  /* Progress */
  .progress-wrap { margin-bottom: 2rem; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem 1.5rem; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text2); margin-bottom: 0.6rem; font-family: 'DM Mono', monospace; }
  .progress-pct { color: var(--gold); font-weight: 500; font-size: 0.9rem; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 100px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 100px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }

  /* Subject group */
  .subject-group { margin-bottom: 1.5rem; }
  .subject-title-row { display: flex; align-items: center; justify-content: space-between; padding: 0.7rem 1rem; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px 6px 0 0; cursor: pointer; user-select: none; }
  .subject-name { font-size: 0.85rem; font-weight: 500; color: var(--gold2); display: flex; align-items: center; gap: 0.6rem; }
  .subject-badge { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text3); background: var(--bg); padding: 0.15rem 0.5rem; border-radius: 100px; border: 1px solid var(--border); }
  .subject-chevron { font-size: 0.7rem; color: var(--text3); transition: transform 0.2s; }
  .subject-chevron.open { transform: rotate(180deg); }
  .items-list { border: 1px solid var(--border); border-top: none; border-radius: 0 0 6px 6px; overflow: hidden; }
  .items-list.collapsed { display: none; }

  /* Item row */
  .item-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 1rem; border-bottom: 1px solid var(--border); transition: background 0.15s; }
  .item-row:last-child { border-bottom: none; }
  .item-row:hover { background: var(--gold-dim2); }
  .item-row.done { background: rgba(46,125,50,0.05); }
  .item-row.done .item-label { color: var(--text3); text-decoration: line-through; text-decoration-color: var(--text3); }
  .check-box { width: 18px; height: 18px; border: 1.5px solid var(--border); border-radius: 4px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; transition: all 0.2s; background: var(--bg); }
  .check-box.checked { background: var(--green2); border-color: var(--green2); color: #fff; }
  .item-label { font-size: 0.82rem; color: var(--text); flex: 1; line-height: 1.4; cursor: pointer; }
  .item-num { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--text3); min-width: 2.2rem; text-align: right; }
  .del-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 0.7rem; padding: 0.2rem 0.4rem; border-radius: 4px; transition: all 0.2s; opacity: 0; }
  .item-row:hover .del-btn { opacity: 1; }
  .del-btn:hover { color: var(--red); background: rgba(192,57,43,0.1); }

  /* Inputs */
  .add-row { display: flex; gap: 0.6rem; }
  .add-input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 0.55rem 0.9rem; font-size: 0.8rem; color: var(--text); font-family: 'Noto Sans KR', sans-serif; outline: none; transition: border-color 0.2s; }
  .add-input::placeholder { color: var(--text3); }
  .add-input:focus { border-color: var(--gold); }
  .add-btn { background: var(--gold-dim); border: 1px solid var(--gold); color: var(--gold); border-radius: 6px; padding: 0.55rem 1rem; font-size: 0.78rem; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; transition: all 0.2s; white-space: nowrap; }
  .add-btn:hover { background: var(--gold); color: var(--bg); }
  .add-subject-row { display: flex; gap: 0.6rem; margin-bottom: 1rem; }

  /* Daily */
  .time-block { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 1rem; }
  .time-block-header { display: flex; align-items: center; gap: 1rem; padding: 0.8rem 1.2rem; background: var(--bg3); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 0.6rem; }
  .time-label { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--gold); min-width: 90px; }
  .time-subject-input { flex: 1; min-width: 120px; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text); font-size: 0.82rem; font-family: 'Noto Sans KR', sans-serif; padding: 0.2rem 0; outline: none; transition: border-color 0.2s; }
  .time-subject-input::placeholder { color: var(--text3); }
  .time-subject-input:focus { border-bottom-color: var(--gold); }
  .time-block-body { padding: 0.8rem 1.2rem; }
  .time-note { width: 100%; background: transparent; border: none; color: var(--text2); font-size: 0.78rem; font-family: 'Noto Sans KR', sans-serif; resize: none; outline: none; line-height: 1.6; min-height: 40px; }
  .time-note::placeholder { color: var(--text3); }
  .time-done-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 100px; padding: 0.3rem 0.8rem; font-size: 0.7rem; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; transition: all 0.2s; white-space: nowrap; }
  .time-done-btn.done { border-color: var(--green2); color: var(--green2); background: rgba(76,175,80,0.08); }
  .add-time-row { display: flex; gap: 0.6rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
  .time-input { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.7rem; font-size: 0.78rem; color: var(--text); font-family: 'DM Mono', monospace; outline: none; width: 110px; transition: border-color 0.2s; }
  .time-input:focus { border-color: var(--gold); }

  /* Overview */
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .ov-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem 1rem; text-align: center; }
  .ov-pct { font-family: 'DM Mono', monospace; font-size: 1.6rem; font-weight: 500; color: var(--gold); line-height: 1; margin-bottom: 0.4rem; }
  .ov-label { font-size: 0.7rem; color: var(--text3); }
  .ov-bar { margin-top: 0.6rem; height: 3px; background: var(--border); border-radius: 100px; overflow: hidden; }
  .ov-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 100px; transition: width 0.6s; }

  /* Toast */
  .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--bg3); border: 1px solid var(--gold); color: var(--gold2); padding: 0.7rem 1.2rem; border-radius: 6px; font-size: 0.78rem; font-family: 'Noto Sans KR', sans-serif; opacity: 0; transform: translateY(10px); transition: all 0.3s; z-index: 1000; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }

  ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 100px; }

  @media (max-width: 600px) {
    header { padding: 0 1rem; }
    main { padding: 1.2rem 1rem 4rem; }
    .section-title { font-size: 1.15rem; }
    .overview-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Firebase 연결 중...</div>
</div>

<header>
  <div class="logo"><div class="logo-icon">⚖</div>법학 스터디 트래커</div>
  <div class="header-right">
    <div class="sync-status" id="syncStatus">연결 중</div>
    <div class="today-info" id="todayInfo"></div>
  </div>
</header>

<nav>
  <button class="nav-btn active" onclick="showSection('overview',this)">📊 전체 현황</button>
  <button class="nav-btn" onclick="showSection('lecture',this)">🎧 인강 진도표</button>
  <button class="nav-btn" onclick="showSection('choice',this)">📝 선택형 진도표</button>
  <button class="nav-btn" onclick="showSection('case',this)">⚖️ 사례형 진도표</button>
  <button class="nav-btn" onclick="showSection('concept',this)">📖 개념서 정독</button>
  <button class="nav-btn" onclick="showSection('memo',this)">🧠 암기장 정독</button>
  <button class="nav-btn" onclick="showSection('daily',this)">🗓️ 일간 시간표</button>
</nav>

<main>
  <div class="section active" id="section-overview">
    <div class="section-header"><div><div class="section-title">전체 학습 현황</div><div class="section-subtitle">오늘의 진도를 한눈에 확인하세요</div></div></div>
    <div class="overview-grid" id="overviewGrid"></div>
  </div>

  <div class="section" id="section-lecture">
    <div class="section-header"><div><div class="section-title">🎧 인강 진도표</div><div class="section-subtitle">들은 강의를 체크하세요</div></div></div>
    <div class="progress-wrap"><div class="progress-label"><span>전체 진도</span><span class="progress-pct" id="lecture-pct">0%</span></div><div class="progress-bar"><div class="progress-fill" id="lecture-bar" style="width:0%"></div></div></div>
    <div class="add-subject-row"><input class="add-input" id="lecture-subj-input" placeholder="과목명 (예: 민법)" /><button class="add-btn" onclick="addSubject('lecture')">+ 과목 추가</button></div>
    <div id="lecture-groups"></div>
  </div>

  <div class="section" id="section-choice">
    <div class="section-header"><div><div class="section-title">📝 선택형 진도표</div><div class="section-subtitle">선택형 문제풀이 진도를 체크하세요</div></div></div>
    <div class="progress-wrap"><div class="progress-label"><span>전체 진도</span><span class="progress-pct" id="choice-pct">0%</span></div><div class="progress-bar"><div class="progress-fill" id="choice-bar" style="width:0%"></div></div></div>
    <div class="add-subject-row"><input class="add-input" id="choice-subj-input" placeholder="과목명 (예: 헌법)" /><button class="add-btn" onclick="addSubject('choice')">+ 과목 추가</button></div>
    <div id="choice-groups"></div>
  </div>

  <div class="section" id="section-case">
    <div class="section-header"><div><div class="section-title">⚖️ 사례형 진도표</div><div class="section-subtitle">사례형 문제풀이 진도를 체크하세요</div></div></div>
    <div class="progress-wrap"><div class="progress-label"><span>전체 진도</span><span class="progress-pct" id="case-pct">0%</span></div><div class="progress-bar"><div class="progress-fill" id="case-bar" style="width:0%"></div></div></div>
    <div class="add-subject-row"><input class="add-input" id="case-subj-input" placeholder="과목명 (예: 형법)" /><button class="add-btn" onclick="addSubject('case')">+ 과목 추가</button></div>
    <div id="case-groups"></div>
  </div>

  <div class="section" id="section-concept">
    <div class="section-header"><div><div class="section-title">📖 개념서 정독 진도표</div><div class="section-subtitle">챕터별 정독 현황을 체크하세요</div></div></div>
    <div class="progress-wrap"><div class="progress-label"><span>전체 진도</span><span class="progress-pct" id="concept-pct">0%</span></div><div class="progress-bar"><div class="progress-fill" id="concept-bar" style="width:0%"></div></div></div>
    <div class="add-subject-row"><input class="add-input" id="concept-subj-input" placeholder="과목명 (예: 민소법)" /><button class="add-btn" onclick="addSubject('concept')">+ 과목 추가</button></div>
    <div id="concept-groups"></div>
  </div>

  <div class="section" id="section-memo">
    <div class="section-header"><div><div class="section-title">🧠 암기장 정독 진도표</div><div class="section-subtitle">암기장 회독 현황을 체크하세요</div></div></div>
    <div class="progress-wrap"><div class="progress-label"><span>전체 진도</span><span class="progress-pct" id="memo-pct">0%</span></div><div class="progress-bar"><div class="progress-fill" id="memo-bar" style="width:0%"></div></div></div>
    <div class="add-subject-row"><input class="add-input" id="memo-subj-input" placeholder="과목명 (예: 형소법)" /><button class="add-btn" onclick="addSubject('memo')">+ 과목 추가</button></div>
    <div id="memo-groups"></div>
  </div>

  <div class="section" id="section-daily">
    <div class="section-header"><div><div class="section-title">🗓️ 일간 시간표</div><div class="section-subtitle">오늘 공부 시간대별 내용과 완료 여부를 기록하세요</div></div></div>
    <div class="add-time-row">
      <input class="time-input" id="time-start" type="time" value="09:00" />
      <span style="color:var(--text3);font-size:0.8rem;">~</span>
      <input class="time-input" id="time-end" type="time" value="10:00" />
      <button class="add-btn" onclick="addTimeBlock()">+ 시간 추가</button>
    </div>
    <div id="timetable-container"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7YvVu97xIv8Vm3g6RBZ0H_h_SQVrQp3A",
  authDomain: "law-study-tracker.firebaseapp.com",
  projectId: "law-study-tracker",
  storageBucket: "law-study-tracker.firebasestorage.app",
  messagingSenderId: "872781018475",
  appId: "1:872781018475:web:9ee8084776c8cbbcdb882e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docRef = doc(db, "tracker", "my-study-data");

const TRACKER_KEYS = ['lecture','choice','case','concept','memo'];
let state = { lecture:[], choice:[], case:[], concept:[], memo:[], daily:[] };
let saveTimer = null;
let firstLoad = true;

// ── 실시간 동기화 구독 ──
onSnapshot(docRef, (snap) => {
  if (snap.exists()) {
    const d = snap.data();
    state = {
      lecture: d.lecture || [],
      choice:  d.choice  || [],
      case:    d.case    || [],
      concept: d.concept || [],
      memo:    d.memo    || [],
      daily:   d.daily   || [],
    };
    TRACKER_KEYS.forEach(renderSection);
    renderDaily();
    renderOverview();
  }
  if (firstLoad) {
    firstLoad = false;
    document.getElementById('loadingOverlay').classList.add('hidden');
    setSyncStatus('synced', '✓ 동기화됨');
  }
}, (err) => {
  console.error(err);
  setSyncStatus('error', '연결 오류');
  if (firstLoad) {
    firstLoad = false;
    document.getElementById('loadingOverlay').classList.add('hidden');
  }
});

// ── 저장 (디바운스) ──
function scheduleSave() {
  setSyncStatus('syncing', '저장 중...');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await setDoc(docRef, state);
      setSyncStatus('synced', '✓ 동기화됨');
    } catch(e) {
      setSyncStatus('error', '저장 실패');
    }
  }, 600);
}

function setSyncStatus(cls, text) {
  const el = document.getElementById('syncStatus');
  el.className = 'sync-status ' + cls;
  el.textContent = text;
}

// ── NAV ──
window.showSection = (id, btn) => {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  btn.classList.add('active');
  if (id === 'overview') renderOverview();
};

// ── TRACKER ──
function renderSection(type) {
  const groups = state[type] || [];
  const container = document.getElementById(type + '-groups');
  if (!container) return;
  container.innerHTML = '';
  let total = 0, done = 0;

  groups.forEach((group, gi) => {
    const d = group.items.filter(i => i.done).length;
    total += group.items.length; done += d;
    const div = document.createElement('div');
    div.className = 'subject-group';
    div.innerHTML = `
      <div class="subject-title-row" onclick="toggleGroup(this)">
        <div class="subject-name">${group.name}<span class="subject-badge">${d}/${group.items.length}</span></div>
        <span class="subject-chevron open">▼</span>
      </div>
      <div class="items-list">
        ${group.items.map((item, ii) => `
          <div class="item-row ${item.done?'done':''}">
            <div class="check-box ${item.done?'checked':''}" onclick="toggleItem('${type}',${gi},${ii})">${item.done?'✓':''}</div>
            <span class="item-label" onclick="toggleItem('${type}',${gi},${ii})">${item.label}</span>
            <span class="item-num">${ii+1}</span>
            <button class="del-btn" onclick="delItem('${type}',${gi},${ii})">✕</button>
          </div>`).join('')}
        <div class="item-row" style="background:transparent;border:none;">
          <div class="add-row" style="width:100%;">
            <input class="add-input" id="item-input-${type}-${gi}" placeholder="항목 추가 (Enter로 저장)" onkeydown="if(event.key==='Enter')addItem('${type}',${gi})" />
            <button class="add-btn" onclick="addItem('${type}',${gi})">추가</button>
          </div>
        </div>
      </div>`;
    container.appendChild(div);
  });

  const pct = total ? Math.round(done/total*100) : 0;
  const pEl = document.getElementById(type+'-pct');
  const bEl = document.getElementById(type+'-bar');
  if (pEl) pEl.textContent = pct+'%';
  if (bEl) bEl.style.width = pct+'%';
}

window.toggleGroup = (header) => {
  const chevron = header.querySelector('.subject-chevron');
  const list = header.nextElementSibling;
  const open = chevron.classList.contains('open');
  chevron.classList.toggle('open', !open);
  list.classList.toggle('collapsed', open);
};

window.toggleItem = (type, gi, ii) => {
  state[type][gi].items[ii].done = !state[type][gi].items[ii].done;
  renderSection(type); renderOverview(); scheduleSave();
  showToast(state[type][gi].items[ii].done ? '✓ 완료 체크!' : '체크 해제');
};

window.delItem = (type, gi, ii) => {
  state[type][gi].items.splice(ii,1);
  renderSection(type); renderOverview(); scheduleSave();
};

window.addItem = (type, gi) => {
  const inp = document.getElementById(`item-input-${type}-${gi}`);
  const label = inp.value.trim();
  if (!label) return;
  state[type][gi].items.push({label, done:false});
  renderSection(type); renderOverview(); scheduleSave();
  showToast('항목이 추가됐어요');
};

window.addSubject = (type) => {
  const inp = document.getElementById(type+'-subj-input');
  const name = inp.value.trim();
  if (!name) return;
  if (!state[type]) state[type] = [];
  state[type].push({name, items:[]});
  inp.value = '';
  renderSection(type); scheduleSave();
  showToast(`"${name}" 과목이 추가됐어요`);
};

// ── DAILY ──
function renderDaily() {
  const blocks = state.daily || [];
  const container = document.getElementById('timetable-container');
  if (!container) return;
  container.innerHTML = '';
  blocks.forEach((block, bi) => {
    const div = document.createElement('div');
    div.className = 'time-block';
    div.innerHTML = `
      <div class="time-block-header">
        <span class="time-label">${block.start} ~ ${block.end}</span>
        <input class="time-subject-input" placeholder="과목 / 내용" value="${block.subject||''}" onchange="updateBlock(${bi},'subject',this.value)" />
        <button class="time-done-btn ${block.done?'done':''}" onclick="toggleBlockDone(${bi})">${block.done?'✓ 완료':'진행 중'}</button>
        <button class="del-btn" style="opacity:1;" onclick="delBlock(${bi})">✕</button>
      </div>
      <div class="time-block-body">
        <textarea class="time-note" rows="2" placeholder="공부한 내용, 페이지, 메모 등을 자유롭게 적어보세요..." onchange="updateBlock(${bi},'note',this.value)">${block.note||''}</textarea>
      </div>`;
    container.appendChild(div);
  });
}

window.addTimeBlock = () => {
  const start = document.getElementById('time-start').value;
  const end = document.getElementById('time-end').value;
  if (!start||!end) return;
  if (!state.daily) state.daily = [];
  state.daily.push({start, end, subject:'', note:'', done:false});
  renderDaily(); scheduleSave();
  showToast(`${start}~${end} 블록 추가됐어요`);
};

window.updateBlock = (bi, field, val) => {
  state.daily[bi][field] = val; scheduleSave();
};

window.toggleBlockDone = (bi) => {
  state.daily[bi].done = !state.daily[bi].done;
  renderDaily(); renderOverview(); scheduleSave();
  showToast(state.daily[bi].done ? '✓ 완료!' : '진행 중으로 변경');
};

window.delBlock = (bi) => {
  state.daily.splice(bi,1); renderDaily(); renderOverview(); scheduleSave();
};

// ── OVERVIEW ──
function renderOverview() {
  const grid = document.getElementById('overviewGrid');
  if (!grid) return;
  const labels = {lecture:'인강 진도', choice:'선택형', case:'사례형', concept:'개념서', memo:'암기장'};
  let html = '';
  TRACKER_KEYS.forEach(type => {
    const groups = state[type]||[];
    let total=0,done=0;
    groups.forEach(g=>{total+=g.items.length; done+=g.items.filter(i=>i.done).length;});
    const pct = total?Math.round(done/total*100):0;
    html += `<div class="ov-card">
      <div class="ov-pct">${pct}<span style="font-size:0.9rem">%</span></div>
      <div class="ov-label">${labels[type]}</div>
      <div class="ov-bar"><div class="ov-fill" style="width:${pct}%"></div></div>
      <div style="font-size:0.65rem;color:var(--text3);margin-top:0.4rem;font-family:'DM Mono',monospace;">${done}/${total}</div>
    </div>`;
  });
  const db2 = state.daily||[];
  const dDone = db2.filter(b=>b.done).length;
  const dPct = db2.length?Math.round(dDone/db2.length*100):0;
  html += `<div class="ov-card">
    <div class="ov-pct">${dPct}<span style="font-size:0.9rem">%</span></div>
    <div class="ov-label">오늘 시간표</div>
    <div class="ov-bar"><div class="ov-fill" style="width:${dPct}%"></div></div>
    <div style="font-size:0.65rem;color:var(--text3);margin-top:0.4rem;font-family:'DM Mono',monospace;">${dDone}/${db2.length}</div>
  </div>`;
  grid.innerHTML = html;
}

// ── TOAST ──
let toastTimer;
window.showToast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
};

// ── DATE ──
const now = new Date();
const days = ['일','월','화','수','목','금','토'];
document.getElementById('todayInfo').textContent =
  `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} (${days[now.getDay()]})`;
</script>
</body>
</html>
