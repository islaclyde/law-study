<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>법학 공부 트래커</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0c;
    --bg2: #181714;
    --bg3: #211f1b;
    --card: #1c1a17;
    --border: #2e2b25;
    --gold: #c9a84c;
    --gold2: #e8c97a;
    --gold-dim: rgba(201,168,76,0.12);
    --gold-dim2: rgba(201,168,76,0.06);
    --text: #e8e2d6;
    --text2: #9e9789;
    --text3: #5c5850;
    --red: #c0392b;
    --green: #2e7d32;
    --green2: #4caf50;
    --accent: #8b7355;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .logo-icon {
    width: 28px; height: 28px;
    border: 1.5px solid var(--gold);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
  }

  .today-info {
    font-size: 0.75rem;
    color: var(--text2);
    font-family: 'DM Mono', monospace;
  }

  /* ── NAV ── */
  nav {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 0 1.5rem;
  }

  nav::-webkit-scrollbar { display: none; }

  .nav-btn {
    padding: 0.85rem 1.2rem;
    font-size: 0.8rem;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    color: var(--text2);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }

  .nav-btn:hover { color: var(--gold2); }
  .nav-btn.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  /* ── MAIN ── */
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .section { display: none; }
  .section.active { display: block; }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 1.8rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .section-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--gold);
  }

  .section-subtitle {
    font-size: 0.75rem;
    color: var(--text3);
    margin-top: 0.3rem;
    letter-spacing: 0.05em;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    margin-bottom: 2rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.2rem 1.5rem;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text2);
    margin-bottom: 0.6rem;
    font-family: 'DM Mono', monospace;
  }

  .progress-pct {
    color: var(--gold);
    font-weight: 500;
    font-size: 0.9rem;
  }

  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 100px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold2));
    border-radius: 100px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  /* ── SUBJECT GROUP ── */
  .subject-group {
    margin-bottom: 1.5rem;
  }

  .subject-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.7rem 1rem;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    user-select: none;
  }

  .subject-name {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--gold2);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .subject-badge {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--text3);
    background: var(--bg);
    padding: 0.15rem 0.5rem;
    border-radius: 100px;
    border: 1px solid var(--border);
  }

  .subject-chevron {
    font-size: 0.7rem;
    color: var(--text3);
    transition: transform 0.2s;
  }

  .subject-chevron.open { transform: rotate(180deg); }

  .items-list {
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 6px 6px;
    overflow: hidden;
  }

  .items-list.collapsed { display: none; }

  /* ── ITEM ROW ── */
  .item-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.7rem 1rem;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .item-row:last-child { border-bottom: none; }
  .item-row:hover { background: var(--gold-dim2); }

  .item-row.done {
    background: rgba(46,125,50,0.05);
  }

  .item-row.done .item-label {
    color: var(--text3);
    text-decoration: line-through;
    text-decoration-color: var(--text3);
  }

  .check-box {
    width: 18px; height: 18px;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem;
    transition: all 0.2s;
    background: var(--bg);
  }

  .check-box.checked {
    background: var(--green2);
    border-color: var(--green2);
    color: #fff;
  }

  .item-label {
    font-size: 0.82rem;
    color: var(--text);
    flex: 1;
    line-height: 1.4;
    cursor: pointer;
  }

  .item-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--text3);
    min-width: 2.2rem;
    text-align: right;
  }

  /* ── ADD ITEM ── */
  .add-row {
    display: flex;
    gap: 0.6rem;
    margin-top: 0.8rem;
  }

  .add-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.55rem 0.9rem;
    font-size: 0.8rem;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  .add-input::placeholder { color: var(--text3); }
  .add-input:focus { border-color: var(--gold); }

  .add-btn {
    background: var(--gold-dim);
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 6px;
    padding: 0.55rem 1rem;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .add-btn:hover { background: var(--gold); color: var(--bg); }

  .add-subject-row {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }

  /* ── DAILY TIMETABLE ── */
  .timetable-container {
    display: grid;
    gap: 1rem;
  }

  .time-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .time-block-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.8rem 1.2rem;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
  }

  .time-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    color: var(--gold);
    min-width: 90px;
  }

  .time-subject-input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-size: 0.82rem;
    font-family: 'Noto Sans KR', sans-serif;
    padding: 0.2rem 0;
    outline: none;
    transition: border-color 0.2s;
  }

  .time-subject-input::placeholder { color: var(--text3); }
  .time-subject-input:focus { border-bottom-color: var(--gold); }

  .time-block-body {
    padding: 0.8rem 1.2rem;
  }

  .time-note {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text2);
    font-size: 0.78rem;
    font-family: 'Noto Sans KR', sans-serif;
    resize: none;
    outline: none;
    line-height: 1.6;
    min-height: 40px;
  }

  .time-note::placeholder { color: var(--text3); }

  .time-done-btn {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: none;
    border: 1px solid var(--border);
    color: var(--text3);
    border-radius: 100px;
    padding: 0.3rem 0.8rem;
    font-size: 0.7rem;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.2s;
  }

  .time-done-btn.done {
    border-color: var(--green2);
    color: var(--green2);
    background: rgba(76,175,80,0.08);
  }

  /* ── ADD TIME BLOCK ── */
  .add-time-row {
    display: flex;
    gap: 0.6rem;
    margin-top: 1rem;
    align-items: center;
  }

  .time-input {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.7rem;
    font-size: 0.78rem;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    outline: none;
    width: 110px;
    transition: border-color 0.2s;
  }

  .time-input:focus { border-color: var(--gold); }

  /* ── OVERVIEW CARDS ── */
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .ov-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.2rem 1rem;
    text-align: center;
  }

  .ov-pct {
    font-family: 'DM Mono', monospace;
    font-size: 1.6rem;
    font-weight: 500;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 0.4rem;
  }

  .ov-label {
    font-size: 0.7rem;
    color: var(--text3);
    letter-spacing: 0.05em;
  }

  .ov-bar {
    margin-top: 0.6rem;
    height: 3px;
    background: var(--border);
    border-radius: 100px;
    overflow: hidden;
  }

  .ov-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold2));
    border-radius: 100px;
    transition: width 0.6s;
  }

  /* ── DELETE BTN ── */
  .del-btn {
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 0.7rem;
    padding: 0.2rem 0.4rem;
    border-radius: 4px;
    transition: all 0.2s;
    opacity: 0;
  }

  .item-row:hover .del-btn { opacity: 1; }
  .del-btn:hover { color: var(--red); background: rgba(192,57,43,0.1); }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 100px; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--bg3);
    border: 1px solid var(--gold);
    color: var(--gold2);
    padding: 0.7rem 1.2rem;
    border-radius: 6px;
    font-size: 0.78rem;
    font-family: 'Noto Sans KR', sans-serif;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    z-index: 1000;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    header { padding: 0 1rem; }
    main { padding: 1.2rem 1rem 4rem; }
    .section-title { font-size: 1.15rem; }
    .overview-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⚖</div>
    법학 스터디 트래커
  </div>
  <div class="today-info" id="todayInfo"></div>
</header>

<nav>
  <button class="nav-btn active" onclick="showSection('overview')">📊 전체 현황</button>
  <button class="nav-btn" onclick="showSection('lecture')">🎧 인강 진도표</button>
  <button class="nav-btn" onclick="showSection('choice')">📝 선택형 진도표</button>
  <button class="nav-btn" onclick="showSection('case')">⚖️ 사례형 진도표</button>
  <button class="nav-btn" onclick="showSection('concept')">📖 개념서 정독</button>
  <button class="nav-btn" onclick="showSection('memo')">🧠 암기장 정독</button>
  <button class="nav-btn" onclick="showSection('daily')">🗓️ 일간 시간표</button>
</nav>

<main>

  <!-- ── 전체 현황 ── -->
  <div class="section active" id="section-overview">
    <div class="section-header">
      <div>
        <div class="section-title">전체 학습 현황</div>
        <div class="section-subtitle">오늘의 진도를 한눈에 확인하세요</div>
      </div>
    </div>
    <div class="overview-grid" id="overviewGrid"></div>
  </div>

  <!-- ── 인강 진도표 ── -->
  <div class="section" id="section-lecture">
    <div class="section-header">
      <div>
        <div class="section-title">🎧 인강 진도표</div>
        <div class="section-subtitle">들은 강의를 체크하세요</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>전체 진도</span>
        <span class="progress-pct" id="lecture-pct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="lecture-bar" style="width:0%"></div></div>
    </div>
    <div class="add-subject-row">
      <input class="add-input" id="lecture-subj-input" placeholder="과목명 (예: 민법)" />
      <button class="add-btn" onclick="addSubject('lecture')">+ 과목 추가</button>
    </div>
    <div id="lecture-groups"></div>
  </div>

  <!-- ── 선택형 진도표 ── -->
  <div class="section" id="section-choice">
    <div class="section-header">
      <div>
        <div class="section-title">📝 선택형 진도표</div>
        <div class="section-subtitle">선택형 문제풀이 진도를 체크하세요</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>전체 진도</span>
        <span class="progress-pct" id="choice-pct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="choice-bar" style="width:0%"></div></div>
    </div>
    <div class="add-subject-row">
      <input class="add-input" id="choice-subj-input" placeholder="과목명 (예: 헌법)" />
      <button class="add-btn" onclick="addSubject('choice')">+ 과목 추가</button>
    </div>
    <div id="choice-groups"></div>
  </div>

  <!-- ── 사례형 진도표 ── -->
  <div class="section" id="section-case">
    <div class="section-header">
      <div>
        <div class="section-title">⚖️ 사례형 진도표</div>
        <div class="section-subtitle">사례형 문제풀이 진도를 체크하세요</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>전체 진도</span>
        <span class="progress-pct" id="case-pct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="case-bar" style="width:0%"></div></div>
    </div>
    <div class="add-subject-row">
      <input class="add-input" id="case-subj-input" placeholder="과목명 (예: 형법)" />
      <button class="add-btn" onclick="addSubject('case')">+ 과목 추가</button>
    </div>
    <div id="case-groups"></div>
  </div>

  <!-- ── 개념서 정독 ── -->
  <div class="section" id="section-concept">
    <div class="section-header">
      <div>
        <div class="section-title">📖 개념서 정독 진도표</div>
        <div class="section-subtitle">개념서 챕터별 정독 현황을 체크하세요</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>전체 진도</span>
        <span class="progress-pct" id="concept-pct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="concept-bar" style="width:0%"></div></div>
    </div>
    <div class="add-subject-row">
      <input class="add-input" id="concept-subj-input" placeholder="과목명 (예: 민소법)" />
      <button class="add-btn" onclick="addSubject('concept')">+ 과목 추가</button>
    </div>
    <div id="concept-groups"></div>
  </div>

  <!-- ── 암기장 정독 ── -->
  <div class="section" id="section-memo">
    <div class="section-header">
      <div>
        <div class="section-title">🧠 암기장 정독 진도표</div>
        <div class="section-subtitle">암기장 회독 현황을 체크하세요</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>전체 진도</span>
        <span class="progress-pct" id="memo-pct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="memo-bar" style="width:0%"></div></div>
    </div>
    <div class="add-subject-row">
      <input class="add-input" id="memo-subj-input" placeholder="과목명 (예: 형소법)" />
      <button class="add-btn" onclick="addSubject('memo')">+ 과목 추가</button>
    </div>
    <div id="memo-groups"></div>
  </div>

  <!-- ── 일간 시간표 ── -->
  <div class="section" id="section-daily">
    <div class="section-header">
      <div>
        <div class="section-title">🗓️ 일간 시간표</div>
        <div class="section-subtitle">오늘 공부 시간대별 내용과 완료 여부를 기록하세요</div>
      </div>
    </div>
    <div class="add-time-row">
      <input class="time-input" id="time-start" type="time" value="09:00" />
      <span style="color:var(--text3); font-size:0.8rem;">~</span>
      <input class="time-input" id="time-end" type="time" value="10:00" />
      <button class="add-btn" onclick="addTimeBlock()">+ 시간 추가</button>
    </div>
    <div style="margin-top:1rem;" id="timetable-container"></div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
// ── STATE ──
const KEYS = {
  lecture: 'lst_lecture',
  choice:  'lst_choice',
  case:    'lst_case',
  concept: 'lst_concept',
  memo:    'lst_memo',
  daily:   'lst_daily',
};

function load(key) {
  try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; }
}

function save(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

// ── NAV ──
function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  event.currentTarget.classList.add('active');
  if (id === 'overview') renderOverview();
}

// ── TRACKER SECTIONS ──
const TRACKER_KEYS = ['lecture', 'choice', 'case', 'concept', 'memo'];

function renderSection(type) {
  const groups = load(KEYS[type]);
  const container = document.getElementById(type + '-groups');
  container.innerHTML = '';
  let total = 0, done = 0;

  groups.forEach((group, gi) => {
    const d = group.items.filter(i => i.done).length;
    const t = group.items.length;
    total += t; done += d;

    const div = document.createElement('div');
    div.className = 'subject-group';
    div.innerHTML = `
      <div class="subject-title-row" onclick="toggleGroup(this)">
        <div class="subject-name">
          ${group.name}
          <span class="subject-badge">${d}/${t}</span>
        </div>
        <span class="subject-chevron open">▼</span>
      </div>
      <div class="items-list" id="list-${type}-${gi}">
        ${group.items.map((item, ii) => `
          <div class="item-row ${item.done ? 'done' : ''}" id="row-${type}-${gi}-${ii}">
            <div class="check-box ${item.done ? 'checked' : ''}" onclick="toggleItem('${type}',${gi},${ii})">
              ${item.done ? '✓' : ''}
            </div>
            <span class="item-label" onclick="toggleItem('${type}',${gi},${ii})">${item.label}</span>
            <span class="item-num">${ii+1}</span>
            <button class="del-btn" onclick="delItem('${type}',${gi},${ii})">✕</button>
          </div>
        `).join('')}
        <div class="item-row" style="background:transparent; border:none;">
          <div class="add-row" style="width:100%;">
            <input class="add-input" id="item-input-${type}-${gi}" placeholder="항목 추가 (예: 1강 - 계약의 성립)" onkeydown="if(event.key==='Enter') addItem('${type}',${gi})" />
            <button class="add-btn" onclick="addItem('${type}',${gi})">추가</button>
          </div>
        </div>
      </div>
    `;
    container.appendChild(div);
  });

  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById(type + '-pct').textContent = pct + '%';
  document.getElementById(type + '-bar').style.width = pct + '%';
}

function toggleGroup(header) {
  const chevron = header.querySelector('.subject-chevron');
  const list = header.nextElementSibling;
  const isOpen = chevron.classList.contains('open');
  chevron.classList.toggle('open', !isOpen);
  list.classList.toggle('collapsed', isOpen);
}

function toggleItem(type, gi, ii) {
  const groups = load(KEYS[type]);
  groups[gi].items[ii].done = !groups[gi].items[ii].done;
  save(KEYS[type], groups);
  renderSection(type);
  renderOverview();
  showToast(groups[gi].items[ii].done ? '✓ 완료 체크!' : '체크 해제');
}

function delItem(type, gi, ii) {
  const groups = load(KEYS[type]);
  groups[gi].items.splice(ii, 1);
  save(KEYS[type], groups);
  renderSection(type);
  renderOverview();
}

function addItem(type, gi) {
  const inp = document.getElementById(`item-input-${type}-${gi}`);
  const label = inp.value.trim();
  if (!label) return;
  const groups = load(KEYS[type]);
  groups[gi].items.push({ label, done: false });
  save(KEYS[type], groups);
  renderSection(type);
  renderOverview();
  showToast('항목이 추가됐어요');
}

function addSubject(type) {
  const inp = document.getElementById(type + '-subj-input');
  const name = inp.value.trim();
  if (!name) return;
  const groups = load(KEYS[type]);
  groups.push({ name, items: [] });
  save(KEYS[type], groups);
  inp.value = '';
  renderSection(type);
  showToast(`"${name}" 과목이 추가됐어요`);
}

// ── DAILY ──
function renderDaily() {
  const blocks = load(KEYS.daily);
  const container = document.getElementById('timetable-container');
  container.innerHTML = '';

  blocks.forEach((block, bi) => {
    const div = document.createElement('div');
    div.className = 'time-block';
    div.innerHTML = `
      <div class="time-block-header">
        <span class="time-label">${block.start} ~ ${block.end}</span>
        <input class="time-subject-input" placeholder="과목 / 내용" value="${block.subject || ''}"
          onchange="updateBlock(${bi},'subject',this.value)" />
        <button class="time-done-btn ${block.done ? 'done' : ''}" onclick="toggleBlockDone(${bi})">
          ${block.done ? '✓ 완료' : '진행 중'}
        </button>
        <button class="del-btn" style="opacity:1; color:var(--text3);" onclick="delBlock(${bi})">✕</button>
      </div>
      <div class="time-block-body">
        <textarea class="time-note" rows="2" placeholder="공부한 내용, 페이지, 메모 등을 자유롭게 적어보세요..."
          onchange="updateBlock(${bi},'note',this.value)">${block.note || ''}</textarea>
      </div>
    `;
    container.appendChild(div);
  });
}

function addTimeBlock() {
  const start = document.getElementById('time-start').value;
  const end = document.getElementById('time-end').value;
  if (!start || !end) return;
  const blocks = load(KEYS.daily);
  blocks.push({ start, end, subject: '', note: '', done: false });
  save(KEYS.daily, blocks);
  renderDaily();
  showToast(`${start}~${end} 시간블록 추가됐어요`);
}

function updateBlock(bi, field, val) {
  const blocks = load(KEYS.daily);
  blocks[bi][field] = val;
  save(KEYS.daily, blocks);
}

function toggleBlockDone(bi) {
  const blocks = load(KEYS.daily);
  blocks[bi].done = !blocks[bi].done;
  save(KEYS.daily, blocks);
  renderDaily();
  showToast(blocks[bi].done ? '✓ 해당 시간 완료!' : '진행 중으로 변경');
}

function delBlock(bi) {
  const blocks = load(KEYS.daily);
  blocks.splice(bi, 1);
  save(KEYS.daily, blocks);
  renderDaily();
}

// ── OVERVIEW ──
function renderOverview() {
  const grid = document.getElementById('overviewGrid');
  const labels = {
    lecture: '인강 진도', choice: '선택형', case: '사례형',
    concept: '개념서', memo: '암기장'
  };

  let html = '';
  let totalAll = 0, doneAll = 0;

  TRACKER_KEYS.forEach(type => {
    const groups = load(KEYS[type]);
    let total = 0, done = 0;
    groups.forEach(g => { total += g.items.length; done += g.items.filter(i=>i.done).length; });
    totalAll += total; doneAll += done;
    const pct = total ? Math.round(done / total * 100) : 0;
    html += `
      <div class="ov-card">
        <div class="ov-pct">${pct}<span style="font-size:0.9rem">%</span></div>
        <div class="ov-label">${labels[type]}</div>
        <div class="ov-bar"><div class="ov-fill" style="width:${pct}%"></div></div>
        <div style="font-size:0.65rem; color:var(--text3); margin-top:0.4rem; font-family:'DM Mono',monospace;">${done}/${total}</div>
      </div>
    `;
  });

  // Daily
  const dblocks = load(KEYS.daily);
  const dDone = dblocks.filter(b => b.done).length;
  const dTotal = dblocks.length;
  const dPct = dTotal ? Math.round(dDone / dTotal * 100) : 0;
  html += `
    <div class="ov-card">
      <div class="ov-pct">${dPct}<span style="font-size:0.9rem">%</span></div>
      <div class="ov-label">오늘 시간표</div>
      <div class="ov-bar"><div class="ov-fill" style="width:${dPct}%"></div></div>
      <div style="font-size:0.65rem; color:var(--text3); margin-top:0.4rem; font-family:'DM Mono',monospace;">${dDone}/${dTotal}</div>
    </div>
  `;

  grid.innerHTML = html;
}

// ── TOAST ──
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ── TODAY DATE ──
function setDate() {
  const now = new Date();
  const days = ['일','월','화','수','목','금','토'];
  const str = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} (${days[now.getDay()]})`;
  document.getElementById('todayInfo').textContent = str;
}

// ── INIT ──
setDate();
TRACKER_KEYS.forEach(renderSection);
renderDaily();
renderOverview();
</script>
</body>
</html>
